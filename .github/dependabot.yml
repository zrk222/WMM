version: 2
updates:
  - package-ecosystem: pip
    directories: ['/', '/docs']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python-updates:
        patterns: ['*']
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      javascript-updates:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ['*']
