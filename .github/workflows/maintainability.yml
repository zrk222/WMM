name: Maintainability checks
on:
  pull_request:
    paths:
      - '.factory/**'
      - '.github/workflows/maintainability.yml'
      - '.prettierrc.json'
      - 'ruff.toml'
      - 'tools/check_evidence_budget.py'
      - 'mission_control/automation_execution.py'
      - 'mission_control/static/campaign-monitor.mjs'
  push:
    branches: [main]
    paths:
      - '.factory/**'
      - '.github/workflows/maintainability.yml'
      - '.prettierrc.json'
      - 'ruff.toml'
      - 'tools/check_evidence_budget.py'
      - 'mission_control/automation_execution.py'
      - 'mission_control/static/campaign-monitor.mjs'
permissions:
  contents: read
jobs:
  style-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prevent oversized evidence additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 2; fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python tools/check_evidence_budget.py "$BASE_SHA" "$GITHUB_SHA"
      - name: Check the maintained Python core
        run: |
          python -m pip install --only-binary :all: ruff==0.14.10
          python -m ruff format --check mission_control/automation_execution.py tools/check_evidence_budget.py
          python -m ruff check mission_control/automation_execution.py tools/check_evidence_budget.py
      - name: Check the maintained campaign monitor
        run: npx --yes prettier@3.6.2 --check mission_control/static/campaign-monitor.mjs
