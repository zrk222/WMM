name: Nightly integrity drill
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install runtime profile
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Check integrity, backup restore and migration replay
        run: python tools/integrity_drill.py
      - name: Build the SBOM twice and compare
        run: |
          python tools/build_sbom.py --source-sha "$GITHUB_SHA" --platform Linux --output "$RUNNER_TEMP/sbom-a.json"
          python tools/build_sbom.py --source-sha "$GITHUB_SHA" --platform Linux --output "$RUNNER_TEMP/sbom-b.json"
          cmp "$RUNNER_TEMP/sbom-a.json" "$RUNNER_TEMP/sbom-b.json"
