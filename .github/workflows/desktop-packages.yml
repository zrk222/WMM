name: Desktop runtime packages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  pull_request:
    paths:
      - 'mission_control/desktop.py'
      - 'desktop/launcher/**'
      - 'desktop/src-tauri/**'
      - 'tools/test_native_desktop_bundle.py'
      - 'tests/test_native_desktop_package.py'
      - 'tools/build_desktop.py'
      - 'tools/smoke_desktop_bundle.py'
      - 'tools/test_windows_installer.py'
      - 'tools/test_packaged_first_packet.py'
      - 'tests/test_packaged_first_packet_contract.py'
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - 'tools/build_linux_package.py'
      - 'tools/test_linux_package.py'
      - 'tools/test_host_service.py'
      - 'tools/ci_host_user.py'
      - '.github/workflows/desktop-packages.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WMM_PACKAGED_FIRST_PACKET_TEST: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.factory/package-browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install declared build dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --only-binary :all: pyinstaller==6.22.3 -r docs/requirements-mcp.txt
      - name: Install Ubuntu desktop and protected-storage dependencies
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: |
          python -m pip install --only-binary :all: SecretStorage==3.3.3
          apt_network=(-o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25)
          packages=(dbus gnome-keyring libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libgl1 xvfb xauth openbox wmctrl)
          fetch_packages() {
            sudo timeout --kill-after=10s 90s apt-get "${apt_network[@]}" -o APT::Update::Error-Mode=any update &&
              sudo timeout --kill-after=10s 6m apt-get "${apt_network[@]}" install --yes --no-install-recommends --download-only "${packages[@]}"
          }
          if ! fetch_packages; then
            sources=/etc/apt/sources.list.d/ubuntu.sources
            mirror='https?://azure[.]archive[.]ubuntu[.]com/ubuntu([[:space:]]|$)'
            if ! grep -Eq "$mirror" "$sources"; then
              echo "::error::Ubuntu dependency download failed and the Azure Ubuntu mirror was not configured."
              exit 1
            fi
            echo "::warning::Ubuntu dependency download failed; trying the signed Ubuntu archive once."
            sudo sed -Ei "s@https?://azure[.]archive[.]ubuntu[.]com/ubuntu([[:space:]]|$)@https://archive.ubuntu.com/ubuntu\1@g" "$sources"
            fetch_packages
          fi
          # Retry only downloads, before any package installation can mutate dpkg state.
          sudo apt-get install --yes --no-install-recommends --no-download "${packages[@]}"
      - name: Generate source-bound build-environment SBOM
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "$RUNNER_OS" = "Windows" ]; then platform=Windows; else platform=Linux; fi
          python tools/build_sbom.py --output "release-assets/sbom-$platform.json" --source-sha "$GITHUB_SHA" --platform "$platform"

      - name: Verify desktop entry
        run: python -m unittest tests.test_desktop_entry tests.test_packaged_first_packet_contract -v
      - name: Install declared first-packet browser profile
        run: |
          python -m pip install --only-binary :all: -r docs/requirements-browser.txt
      - name: Provision Windows first-packet browser
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Provision Ubuntu first-packet browser
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Build native Mission Control and its frozen engine
        env:
          WMM_GITHUB_DEVICE_CLIENT_ID: ${{ vars.WMM_GITHUB_DEVICE_CLIENT_ID }}
        run: python tools/build_desktop.py --native-window
      - name: Verify exact native shell and engine
        run: python tools/test_native_desktop_bundle.py dist/desktop/WMM > native-package-receipt.json
      - name: Open and close the Ubuntu native window
        if: runner.os == 'Linux'
        env:
          WMM_LINUX_NATIVE_WINDOW_CI: '1'
        run: |
          dbus-run-session -- xvfb-run -a python tools/test_native_desktop_bundle.py dist/desktop/WMM --linux-window > ubuntu-native-window-receipt.json
      - name: Smoke Windows executable and native protected storage
        if: runner.os == 'Windows'
        run: python tools/smoke_desktop_bundle.py
      - name: Smoke Linux executable with isolated encrypted Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d "$RUNNER_TEMP/wmm-package-keyring.XXXXXX")"
            printf "%s\n" "disposable-synthetic-package-keyring" | gnome-keyring-daemon --unlock --components=secrets
            python tools/smoke_desktop_bundle.py
          '
      - name: Build Ubuntu desktop package
        if: runner.os == 'Linux'
        run: python tools/build_linux_package.py
      - name: Verify isolated Ubuntu install upgrade and removal
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --yes --no-install-recommends libtk8.6 libgl1 xdg-utils ffmpeg fonts-dejavu-core
          sudo env CI=true GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" WMM_HOST_SERVICE_CI=1 WMM_LINUX_PACKAGE_TEST=1 WMM_ISOLATED_NATIVE_KEYRING=1 WMM_PACKAGED_FIRST_PACKET_TEST=1 PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" WMM_TEST_PYTHON="$(command -v python)" WMM_TEST_ROOT="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d "$RUNNER_TEMP/wmm-deb-keyring.XXXXXX")"
            printf "%s\n" "disposable-synthetic-deb-keyring" | gnome-keyring-daemon --unlock --components=secrets
            "$WMM_TEST_PYTHON" "$WMM_TEST_ROOT/tools/test_linux_package.py" > "$WMM_TEST_ROOT/linux-lifecycle.json"
          '
      - name: Retain Ubuntu installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-Ubuntu-${{ github.sha }}
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Compile per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler missing on runner' }
          & $compiler 'packaging\windows\WMM.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify exact final Windows installer upgrade and uninstall
        if: runner.os == 'Windows'
        env:
          WMM_INSTALLER_TEST: '1'
          WMM_RELEASE_INSTALLER: ${{ github.workspace }}/dist/installer/WMM-Setup.exe
        run: |
          python tools/test_windows_installer.py > windows-lifecycle.json
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle failed' }
      - name: Retain Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-Setup-${{ github.sha }}
          path: dist/installer/WMM-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Seal exact installer lifecycle receipt
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            platform=Windows
            asset=dist/installer/WMM-Setup.exe
            lifecycle=windows-lifecycle.json
          else
            platform=Linux
            asset=dist/linux/wize-marketing-machine_0.1.0_amd64.deb
            lifecycle=linux-lifecycle.json
          fi
          python tools/publish_desktop_release.py receipt --platform "$platform" --sha "$GITHUB_SHA" --asset "$asset" --lifecycle "$lifecycle" --destination "release-assets/$platform.json"
          cp "$asset" release-assets/
      - name: Retain only passed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-release-${{ runner.os }}-${{ inputs.candidate_sha || github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Retain runtime without operational data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-desktop-${{ matrix.os }}-${{ github.sha }}
          path: dist/desktop/WMM/
          if-no-files-found: error
          retention-days: 7
      - name: Retain packaged first-packet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-first-packet-${{ matrix.os }}-${{ github.sha }}
          path: |
            .factory/packaged-first-packet/
            .factory/packaged-agent-setup-evidence/
            .factory/packaged-native-window/
            native-package-receipt.json
            ubuntu-native-window-receipt.json
          if-no-files-found: error
          retention-days: 7
