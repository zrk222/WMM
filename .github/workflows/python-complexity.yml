name: Python complexity budget
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: python-complexity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python-complexity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the pinned formatter
        run: 'python -m pip install --require-hashes --only-binary :all: -r docs/requirements-dev.txt'
      - name: Check complexity against the exact base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 2; fi
          python tools/check_complexity.py --base "$BASE_SHA"
