name: Repository hygiene
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Retain the eligible-branch manifest without deleting branches
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: repository-branch-hygiene
  cancel-in-progress: false
jobs:
  stale-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Write exact eligible-branch manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/branch_hygiene.py plan
      - name: Retain manifest before any deletion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: branch-hygiene-before-deletion
          path: .factory/branch-hygiene/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Recheck and delete eligible stale merged branches
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/branch_hygiene.py apply
      - name: Retain actual branch outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: branch-hygiene-outcomes
          path: .factory/branch-hygiene/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
