name: Dependency freshness
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-freshness
  cancel-in-progress: false
jobs:
  python-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Validate exact dependency pins
        run: |
          mkdir -p .factory/dependency-audit
          echo '{"status":"NOT_RUN"}' > .factory/dependency-audit/pip-status.json
          python tools/dependency_freshness.py validate
      - name: Install hash-locked advisory tools
        run: 'python -m pip install --require-hashes --only-binary :all: -r docs/requirements-audit.txt'
      - name: Audit the locked runtime and small development profiles
        run: |
          mkdir -p .factory/dependency-audit
          if python -m pip_audit --require-hashes --strict --disable-pip -r requirements.txt -r docs/requirements-dev.txt -r docs/requirements-properties.txt --format json --output .factory/dependency-audit/pip.json 2> .factory/dependency-audit/pip-errors.log; then status=0; else status=$?; fi
          printf '{"exit_code":%s}\n' "$status" > .factory/dependency-audit/pip-status.json
          exit "$status"
      - name: Retain Python advisory reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-advisory-results
          path: .factory/dependency-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  javascript-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact npm lock without lifecycle scripts
        run: |
          mkdir -p .factory/dependency-audit
          echo '{"status":"NOT_RUN"}' > .factory/dependency-audit/npm-status.json
          npm ci --ignore-scripts
      - name: Audit the npm dependency lock
        run: |
          mkdir -p .factory/dependency-audit
          if npm audit --json > .factory/dependency-audit/npm.json 2> .factory/dependency-audit/npm-errors.log; then status=0; else status=$?; fi
          printf '{"exit_code":%s}\n' "$status" > .factory/dependency-audit/npm-status.json
          exit "$status"
      - name: Retain JavaScript advisory reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: javascript-advisory-results
          path: .factory/dependency-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  propose-ffmpeg:
    if: github.repository == 'zrk222/WMM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Skip duplicate open FFmpeg proposals
        id: existing
        run: |
          set -euo pipefail
          count=$(gh pr list --repo zrk222/WMM --state open --limit 1000 --json headRefName --jq '[.[] | select(.headRefName | startswith("codex/deps-ffmpeg-"))] | length')
          if [ "$count" -gt 0 ]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - name: Read official release metadata without binary download
        if: steps.existing.outputs.skip == 'false'
        run: |
          mkdir -p .factory
          gh api --hostname github.com repos/GyanD/codexffmpeg/releases/latest > .factory/ffmpeg-release.json
      - name: Prepare verified FFmpeg pin proposal
        id: update
        if: steps.existing.outputs.skip == 'false'
        run: python tools/dependency_freshness.py prepare --metadata .factory/ffmpeg-release.json >> "$GITHUB_OUTPUT"
      - name: Create a fresh review branch and explicitly dispatch all checks
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          BRANCH="codex/deps-ffmpeg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          [ -z "$remote" ]
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add -- tools/ffmpeg-pin.json
          [ "$(git diff --cached --name-only)" = "tools/ffmpeg-pin.json" ]
          git commit -m 'Update FFmpeg verified binary pin'
          # An empty expected SHA permits only creating the ref; it cannot overwrite one.
          git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:"
          python -c 'from pathlib import Path; Path(".factory/ffmpeg-pr.md").write_text("Updates only tools/ffmpeg-pin.json from verified official release metadata. Workflow files and CI baselines remain unchanged. No binary download or automatic merge. Standard checks are explicitly dispatched for this branch and exact main base. See the retained dependency-freshness receipt.")'
          gh pr create --repo zrk222/WMM --head "$BRANCH" --base main --title 'Update FFmpeg verified binary pin' --body-file .factory/ffmpeg-pr.md
          gh workflow run checks.yml --repo zrk222/WMM --ref "$BRANCH" -f "base_sha=$BASE"
      - name: Retain FFmpeg metadata and update receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ffmpeg-proposal-receipt
          path: |
            .factory/ffmpeg-release.json
            .factory/ffmpeg-update.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
