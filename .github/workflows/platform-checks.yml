{
  "name": "Native iOS platform checks",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {"paths": ["ios/**", "tools/check_platform_receipts.py", "tests/test_platform_receipts.py", ".github/workflows/platform-checks.yml"]}
  },
  "permissions": {"contents": "read"},
  "jobs": {
    "contract": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"},
        {"uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": {"python-version": "3.11"}},
        {"run": "python tools/check_platform_receipts.py --ci-contract"},
        {"run": "python -m unittest tests.test_platform_receipts -v"}
      ]
    },
    "native-simulators": {
      "if": "github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'",
      "needs": "contract",
      "runs-on": "macos-15-intel",
      "timeout-minutes": 120,
      "steps": [
        {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"},
        {"uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": {"python-version": "3.13"}},
        {"name": "Record actual source and toolchain", "id": "toolchain", "run": "set -euo pipefail\nmkdir -p ios/build-evidence\ngit rev-parse HEAD > ios/build-evidence/source-commit.txt\nxcodebuild -version > ios/build-evidence/xcode-version.txt\nxcrun simctl list devices available -j > ios/build-evidence/simulator-inventory.json\necho \"xcode=$(shasum -a 256 ios/build-evidence/xcode-version.txt | cut -d ' ' -f1)\" >> \"$GITHUB_OUTPUT\""},
        {"name": "Restore exact embedded runtime cache", "id": "runtime_cache", "uses": "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", "with": {"path": "ios/Python.xcframework\nios/runtime-cache.json", "key": "wmm-runtime-v1-${{ runner.os }}-${{ runner.arch }}-py313-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('ios/Build/Runtime.lock', 'ios/Build/build_runtime.py') }}"}},
        {"name": "Build pinned embedded runtime", "run": "set -euo pipefail\npython3 ios/Build/build_runtime.py 2>&1 | tee ios/build-evidence/runtime-build.log"},
        {"name": "Save verified embedded runtime before simulator tests", "if": "steps.runtime_cache.outputs.cache-hit != 'true'", "uses": "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", "with": {"path": "ios/Python.xcframework\nios/runtime-cache.json", "key": "${{ steps.runtime_cache.outputs.cache-primary-key }}"}},
        {"name": "Generate native application targets", "run": "set -euo pipefail\npython3 ios/Build/generate_project.py\nxcodebuild -list -project ios/WMM.xcodeproj > ios/build-evidence/project-targets.txt"},
        {"name": "Test actual iPhone and iPad simulators", "run": "set -euo pipefail\npython3 ios/Build/run_simulators.py 2>&1 | tee ios/build-evidence/simulator-tests.log"},
        {"name": "Retain native results including failures", "if": "always()", "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {"name": "native-ios-${{ github.sha }}-${{ github.run_id }}", "path": "ios/build-evidence/**\nios/DerivedData/Logs/Test/**\nios/DerivedData/Build/Products/Debug-iphonesimulator/WMM.app", "if-no-files-found": "error", "retention-days": 14}}
      ]
    }
  }
}
