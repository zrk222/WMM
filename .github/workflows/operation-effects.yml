name: Operation effect tripwire
on:
  push:
    branches: [main]
    paths: ['mission_control/**', 'tools/audit_operation_effects.py', 'tests/test_operation_effect_audit.py', '.github/workflows/operation-effects.yml']
  pull_request:
    paths: ['mission_control/**', 'tools/audit_operation_effects.py', 'tests/test_operation_effect_audit.py', '.github/workflows/operation-effects.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  effect-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove mislabeled provider paths fail the static tripwire
        run: python -m unittest tests.test_operation_effect_audit -v
      - name: Audit every current catalog descriptor
        run: python tools/audit_operation_effects.py > operation-effect-audit.json
