name: Local application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned timezone data
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Install optional native integration-test tools
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress
      - name: Verify full test-profile prerequisites
        run: python -c "from zoneinfo import ZoneInfo; from mission_control.media_native import capability; ZoneInfo('America/Toronto'); assert capability()['status'] == 'READY', capability()"
      - name: Check clean distribution
        run: python tools/check_distribution.py
      - name: Run isolated synthetic regressions
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"
