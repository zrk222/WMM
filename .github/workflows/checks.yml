name: Local application checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  HYPOTHESIS_PROFILE: wmm-ci
jobs:
  maintainability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Enforce automatically enrolled source ratchets
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$RATCHET_BASE" =~ ^[0-9a-f]{40}$ ]]; then exit 2; fi
          git fetch --no-tags --depth=1 origin "$RATCHET_BASE"
          python tools/source_ratchet.py --base "$RATCHET_BASE" --head HEAD
      - name: Install pinned runtime and formatter
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --require-hashes --only-binary :all: -r docs/requirements-dev.txt
      - name: Install hash-pinned property profile
        run: |
          python -m pip install --require-hashes --only-binary :all: -r docs/requirements-properties.txt
      - name: Install pinned JavaScript tooling
        run: npm ci --ignore-scripts
      - name: Check import layering and catalog coverage
        run: python tools/check_layering.py
      - name: Check generated schema and operation references
        run: |
          python tools/generate_schema_types.py --check
          python tools/generate_operation_docs.py --check
      - name: Check maintained formatting and lint
        run: python tools/check_format.py
      - name: Install hash-pinned optional report imports for static analysis
        run: 'python -m pip install --require-hashes --no-deps --only-binary :all: -r docs/requirements-report-types.txt'
      - name: Check maintained native JavaScript library types
        run: node tools/check_js_types.mjs
      - name: Check maintained Python types
        run: python tools/check_types.py
      - name: Check SQL statement budgets
        run: python tools/query_budget.py
      - name: Check integrity, backup restore and migration replay
        run: python tools/integrity_drill.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install declared browser test profile
        timeout-minutes: 20
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
          python -m pip install --only-binary :all: -r docs/requirements-browser.txt
          python -m pip install --only-binary :all: -r docs/requirements-auth.txt
          python -m playwright install --only-shell chromium
          bash tools/ci_ubuntu_apt.sh ffmpeg fonts-dejavu-core
      - name: Verify the pinned headless Chromium can start
        run: >-
          python -c "from playwright.sync_api import sync_playwright;
          pw=sync_playwright().start(); browser=pw.chromium.launch();
          assert browser.new_page().evaluate('1+1')==2; browser.close(); pw.stop()"
      - name: Verify local render prerequisites before queueing
        run: python -c "from mission_control.media_native import capability; result = capability(); assert result['status'] == 'READY', result"
      - name: Exercise owner batch and OneSignal browser flows at desktop and mobile widths
        env:
          WMM_BROWSER_TEST_PROFILE: '1'
        run: python -m unittest tests.test_creative_batches_browser tests.test_onesignal_ui_browser tests.test_onesignal_browser_integration tests.test_organic_research_browser tests.test_market_research_browser tests.test_organic_policy_gui_browser tests.test_publication_browser -v
      - name: Verify saved rule simulation on phone and desktop
        env:
          WMM_BROWSER_TEST_PROFILE: '1'
        run: python -m unittest tests.test_automation_rules_browser -v
      - name: Retain synthetic publication review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-browser-evidence
          path: .factory/multichannel/browser/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Verify saved analytics history at desktop and mobile widths
        env:
          WMM_BROWSER_TEST_PROFILE: '1'
        run: python -m unittest tests.test_insights_history_browser tests.test_observational_campaign_browser -v
      - name: Verify owner onboarding and protective campaign pause in Chromium
        run: |
          python tools/test_owner_onboarding_browser.py
          python tools/test_goal_journey_browser.py
          python tools/test_install_report_browser.py
          python tools/test_campaign_monitor_browser.py
          python tools/test_organic_taste_browser.py
          python tools/test_goal_packet_history_browser.py
          python tools/test_weekly_review_actions_browser.py
          python tools/test_client_dashboard_browser.py
          python tools/test_authority_expiry_browser.py
          python tools/test_agent_task_presets_browser.py
      - name: Verify actionable rejection and uncertain-delivery feedback
        env:
          WMM_BROWSER_TEST_PROFILE: '1'
        run: python -m unittest tests.test_operation_feedback_browser -v
      - name: Verify the owner automation journey and paid agreement in Chromium
        env:
          WMM_AGREEMENT_BROWSER_OUT: .factory/owner-agreement-browser
        run: |
          python tools/test_goal_automation_browser.py
          python tools/test_agreement_paid_browser.py
      - name: Retain owner automation and agreement receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-automation-browser-receipts
          path: |
            .factory/agent-mode-browser/automation-browser.json
            .factory/owner-agreement-browser/agreement-paid-browser.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Retain synthetic goal-first packet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: goal-first-browser-evidence
          path: .factory/goal-first-automation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned property profile
        id: property_dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r docs/requirements-properties.txt
      - name: Restore synthetic property examples
        id: property_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .factory/hypothesis/examples
          key: hypothesis-${{ runner.os }}-py311-${{ hashFiles('docs/requirements-properties.txt') }}-pr${{ github.event.pull_request.number || 'main' }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hypothesis-${{ runner.os }}-py311-${{ hashFiles('docs/requirements-properties.txt') }}-pr${{ github.event.pull_request.number || 'main' }}-shard${{ matrix.shard }}-
      - name: Install hash-pinned timezone data
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Install declared optional MCP test profile
        run: |
          python -m pip install --only-binary :all: -r docs/requirements-mcp.txt
          python -m pip install --only-binary :all: -r docs/requirements-auth.txt
      - name: Install optional native integration-test tools
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-full_build.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip' -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b') { throw 'FFmpeg archive digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'wmm-ffmpeg-9.0.2'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = @(Get-ChildItem -LiteralPath $destination -Filter ffmpeg.exe -File -Recurse)
          if ($binary.Count -ne 1) { throw 'Expected one pinned FFmpeg executable' }
          if (!(Test-Path -LiteralPath (Join-Path $binary[0].DirectoryName 'ffprobe.exe'))) { throw 'Pinned FFprobe missing' }
          $binary[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify full test-profile prerequisites
        run: python -c "from zoneinfo import ZoneInfo; from importlib.metadata import version; from mission_control.media_native import capability; ZoneInfo('America/Toronto'); assert capability()['status'] == 'READY', capability(); assert version('mcp') == '1.30.0', version('mcp')"
      - name: Verify batch inspection with pinned FFmpeg 9
        if: matrix.shard == 0
        run: python -m unittest tests.test_creative_batches.CreativeBatchTests.test_real_batch_render_inspection_and_completion tests.test_creative_batches.CreativeBatchTests.test_real_output_is_decoded_but_visual_review_remains_unknown -v
      - name: Check clean distribution
        run: python tools/check_distribution.py
      - name: Verify all browser logic suites
        run: |
          node --version
          $testFiles = Get-ChildItem -Path tests -File | Where-Object { $_.Name -match '\.test\.(cjs|mjs)$' }
          if ($testFiles.Count -eq 0) { throw 'No browser logic tests found' }
          node --test @($testFiles.FullName)
      - name: Run isolated synthetic regressions
        run: python -X utf8 tools/run_ci_tests.py --shards 4 --index ${{ matrix.shard }}
      - name: Retain minimized synthetic property examples
        if: always() && steps.property_dependencies.outcome == 'success' && steps.property_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .factory/hypothesis/examples
          key: ${{ steps.property_cache.outputs.cache-primary-key }}

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned property profile
        id: property_dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r docs/requirements-properties.txt
      - name: Restore synthetic property examples
        id: property_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .factory/hypothesis/examples
          key: hypothesis-${{ runner.os }}-py311-${{ hashFiles('docs/requirements-properties.txt') }}-pr${{ github.event.pull_request.number || 'main' }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hypothesis-${{ runner.os }}-py311-${{ hashFiles('docs/requirements-properties.txt') }}-pr${{ github.event.pull_request.number || 'main' }}-shard${{ matrix.shard }}-
      - name: Install hash-pinned timezone data
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.txt
      - name: Install declared optional MCP test profile
        run: |
          python -m pip install --only-binary :all: -r docs/requirements-mcp.txt
          python -m pip install --only-binary :all: -r docs/requirements-auth.txt
      - name: Install native Linux credential dependency
        run: python -m pip install SecretStorage==3.3.3
      - name: Install optional native integration-test tools
        timeout-minutes: 20
        run: bash tools/ci_ubuntu_apt.sh ffmpeg fonts-dejavu-core dbus gnome-keyring
      - name: Verify Linux Secret Service round trip and locked rejection
        if: matrix.shard == 0
        shell: bash
        env:
          WMM_ISOLATED_NATIVE_KEYRING: '1'
        run: |
          XDG_DATA_HOME="$(mktemp -d "$RUNNER_TEMP/wmm-native-vault-data.XXXXXX")"
          XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/wmm-native-vault-runtime.XXXXXX")"
          export XDG_DATA_HOME XDG_RUNTIME_DIR
          unset GNOME_KEYRING_CONTROL
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s\n" "disposable-synthetic-native-keyring" | gnome-keyring-daemon --unlock --components=secrets
            if ! output="$(python -X utf8 -m unittest discover -s tests -p test_linux_vault_native.py -v 2>&1)"; then
              printf "%s\n" "$output" >&2
              exit 1
            fi
            printf "%s\n" "$output"
            grep -Fxq "LINUX_NATIVE_VAULT_ROUNDTRIP_SCOPE_REPLACE_DELETE_CLEANUP_LOCK_PASS" <<< "$output"
          '
      - name: Verify full test-profile prerequisites
        run: python -c "from zoneinfo import ZoneInfo; from importlib.metadata import version; from mission_control.media_native import capability; ZoneInfo('America/Toronto'); assert capability()['status'] == 'READY', capability(); assert version('mcp') == '1.30.0', version('mcp')"
      - name: Check clean distribution
        run: python tools/check_distribution.py
      - name: Verify all browser logic suites
        run: |
          node --version
          mapfile -t test_files < <(find tests -maxdepth 1 -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) | sort)
          test "${#test_files[@]}" -gt 0
          node --test "${test_files[@]}"
      - name: Run isolated synthetic regressions
        env:
          WMM_CI_SHARD: ${{ matrix.shard }}
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d "$RUNNER_TEMP/wmm-keyring.XXXXXX")"
            printf "%s\n" "disposable-synthetic-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            python -X utf8 tools/run_ci_tests.py --shards 4 --index "$WMM_CI_SHARD"
          '
      - name: Retain minimized synthetic property examples
        if: always() && steps.property_dependencies.outcome == 'success' && steps.property_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .factory/hypothesis/examples
          key: ${{ steps.property_cache.outputs.cache-primary-key }}
