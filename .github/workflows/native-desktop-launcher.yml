name: Native desktop launcher checks

on:
  pull_request:
    paths:
      - '.github/workflows/native-desktop-launcher.yml'
      - 'desktop/launcher/**'
      - 'mission_control/desktop*.py'
      - 'mission_control/server.py'
      - 'tests/test_desktop_sidecar.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-desktop-launcher.yml'
      - 'desktop/launcher/**'
      - 'mission_control/desktop*.py'
      - 'mission_control/server.py'
      - 'tests/test_desktop_sidecar.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned WMM runtime prerequisites
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements.txt"
      - name: Verify the Rust parent and real Python child
        run: cargo test --locked --manifest-path desktop/launcher/Cargo.toml
      - name: Verify the child protocol and workspace cleanup
        run: python -B -m unittest tests.test_desktop_sidecar -v
