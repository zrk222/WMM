name: Schedule authority coverage
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: authority-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  schedule-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned coverage and runtime
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements.txt -r docs/requirements-coverage.txt'
      - name: Measure schedule authority with synthetic provider tests
        run: |
          python -m coverage run --branch --include='*/campaign_schedule_authority.py' -m unittest -q tests.test_campaign_schedule tests.test_campaign_schedule_http tests.test_organic_video_schedule tests.test_authority_expiry_children tests.test_schedule_authority_boundary
          python -m coverage json -o authority-coverage.json
          python tools/check_authority_coverage.py authority-coverage.json
      - name: Challenge exact schedule authority decisions
        run: python tools/check_schedule_mutations.py
      - name: Retain line and branch counts for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schedule-authority-coverage
          path: authority-coverage.json
          if-no-files-found: ignore
          retention-days: 7
