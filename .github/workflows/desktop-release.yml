name: Desktop public prerelease
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main commit SHA (40 lowercase hex)
        required: true
        type: string
      tag:
        description: New immutable version tag (for example v0.1.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-public-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Admit exact official main candidate
        id: target
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, subprocess, runpy
          validate_target = runpy.run_path('tools/publish_desktop_release.py')['validate_target']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          validate_target(os.environ['CANDIDATE'], sha, os.environ['GITHUB_REF'], os.environ['GITHUB_REPOSITORY'], os.environ['TAG'])
          if sha != os.environ['DISPATCH_SHA']:
              raise SystemExit('Main moved after dispatch; start a fresh run with its exact SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Check eligible release reviewer is configured
        env:
          REVIEWER_ID: ${{ vars.WMM_RELEASE_REVIEWER_ID }}
        run: python -c 'import os; r=os.environ["REVIEWER_ID"]; assert r.isascii() and r.isdigit() and int(r)>0 and int(r)!=int(os.environ["GITHUB_ACTOR_ID"]), "Configure an independent release reviewer distinct from the dispatch actor"'
      - name: Require publisher browser sign-in configuration
        env:
          WMM_GITHUB_DEVICE_CLIENT_ID: ${{ vars.WMM_GITHUB_DEVICE_CLIENT_ID }}
        run: python -c "import runpy; runpy.run_path('tools/build_desktop.py')['public_device_client'](required=True)"
      - name: Check Windows signing settings before building packages
        env:
          WMM_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WMM_WINDOWS_SIGNER_THUMBPRINT }}
          WMM_WINDOWS_TIMESTAMP_URL: ${{ vars.WMM_WINDOWS_TIMESTAMP_URL }}
        run: |
          python - <<'PY'
          import os, runpy
          validate = runpy.run_path('tools/publish_desktop_release.py')['validate_signing_config']
          validate(os.environ.get('WMM_WINDOWS_SIGNER_THUMBPRINT'), os.environ.get('WMM_WINDOWS_TIMESTAMP_URL'))
          PY
      - name: Release protocol unit checks
        run: python -m unittest tests.test_desktop_release tests.test_release_provenance tests.test_verify_release_assets tests.test_release_attestation_assets tests.test_release_clearance -v
  packages:
    needs: validate
    uses: ./.github/workflows/desktop-packages.yml
    with:
      candidate_sha: ${{ needs.validate.outputs.sha }}
      require_signed_windows: true
  prepare:
    needs: [validate, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.prepared.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: WMM-release-*-${{ needs.validate.outputs.sha }}
          path: release-assets
          merge-multiple: true
      - name: Attest release asset provenance
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: 'release-assets/*'
      - name: Verify official source-bound provenance for all release payloads
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.validate.outputs.sha }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python tools/verify_release_provenance.py --folder release-assets --sha "$CANDIDATE" --bundle "$ATTESTATION_BUNDLE"
      - name: Retain verified provenance receipt before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-provenance-${{ needs.validate.outputs.sha }}
          path: .factory/release-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bind signed assets and approval instructions
        id: prepared
        env:
          CANDIDATE: ${{ needs.validate.outputs.sha }}
          TAG: ${{ inputs.tag }}
          WMM_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WMM_WINDOWS_SIGNER_THUMBPRINT }}
        run: python tools/check_release_clearance.py prepare --folder release-assets --sha "$CANDIDATE" --tag "$TAG"
      - name: Upload immutable reviewed payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WMM-prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, prepare]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: WMM-prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Verify the independent approval of the exact signed release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.validate.outputs.sha }}
          TAG: ${{ inputs.tag }}
          PREPARED: ${{ needs.prepare.outputs.digest }}
          WMM_RELEASE_REVIEWER_ID: ${{ vars.WMM_RELEASE_REVIEWER_ID }}
          WMM_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WMM_WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/release-approvals.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE" > "$RUNNER_TEMP/release-candidate.json"
          python tools/check_release_clearance.py verify --folder release-assets --sha "$CANDIDATE" --tag "$TAG" --expected "$PREPARED" --candidate-metadata "$RUNNER_TEMP/release-candidate.json" --reviews "$RUNNER_TEMP/release-approvals.json"
      - name: Verify both receipts, publish prerelease, verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.validate.outputs.sha }}
          TAG: ${{ inputs.tag }}
          WMM_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.WMM_WINDOWS_SIGNER_THUMBPRINT }}
        run: python tools/publish_desktop_release.py publish --folder release-assets --sha "$CANDIDATE" --tag "$TAG"
