workflows:
  wmm-ios-simulator:
    name: WMM native iPhone and iPad simulator verification
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    cache:
      cache_paths:
        - ios/Python.xcframework
        - ios/runtime-cache.json
    scripts:
      - name: Record source and toolchain
        script: |
          set -euo pipefail
          mkdir -p ios/build-evidence
          git rev-parse HEAD > ios/build-evidence/source-commit.txt
          xcodebuild -version > ios/build-evidence/xcode-version.txt
          xcrun simctl list devices available -j > ios/build-evidence/simulator-inventory.json
      - name: Build the pinned embedded Python runtime
        script: |
          set -euo pipefail
          python3 ios/Build/build_runtime.py 2>&1 | tee ios/build-evidence/runtime-build.log
      - name: Generate the native application and test targets
        script: |
          set -euo pipefail
          python3 ios/Build/generate_project.py
          xcodebuild -list -project ios/WMM.xcodeproj > ios/build-evidence/project-targets.txt
      - name: Run native tests on iPhone and iPad simulators
        script: |
          set -euo pipefail
          python3 ios/Build/run_simulators.py 2>&1 | tee ios/build-evidence/simulator-tests.log
    artifacts:
      - ios/build-evidence/**
      - ios/DerivedData/Logs/Test/**
      - ios/DerivedData/Build/Products/Debug-iphonesimulator/WMM.app
