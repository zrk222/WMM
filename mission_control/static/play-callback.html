<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Play connection · WMM</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/play-callback.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#connection-result">Skip to connection status</a>
  <main id="connection-result" class="workspace" tabindex="-1">
    <section class="panel" aria-labelledby="connection-title">
      <p class="eyebrow">GOOGLE PLAY / CONNECTION</p>
      <h1 id="connection-title">Finishing your connection</h1>
      <p id="play-callback-status" role="status">Checking the approved app and read access. Keep Mission Control running.</p>
      <p>Access is saved only after a read of the selected package and track succeeds.</p>
      <a class="button" href="/">Return to Mission Control</a>
    </section>
  </main>
</body>
</html>
